verbose: True
seed: 42
model_type: "default"

paths:
  input_dir: "/scratch4/GFDL/gfdlscr/Uriel.Ramirez/DEV/LIGHTING/anemoi_prep"
  training: "train_dataset.zarr"
  validating: "val_dataset.zarr"
  testing: "test_dataset.zarr"

hyperparameters:
  batch_size: 32
  learning_rate: 0.0001

data_config:
  type: "residual"     # "default" or "residual"
  method:
    name: "autoregressive"      # "lags" or "autoregressive"
    nsteps: 3  #nlags or nsteps

use_coordinates: True

variables:
  air_temperature_at_two_meters:
    is_input: true
    is_output: true
    is_static: false
    target_weight: 1.0
    normalization: "z-score"
    units: "K"

  DSWRFtoa:
    is_input: true
    is_output: false
    is_static: false
    normalization: "z-score"
    units: "W/m^2"

  HGTsfc:
    is_input: true
    is_output: false
    is_static: true
    normalization: "z-score"
    units: "m"

  land_fraction:
    is_input: true
    is_output: false
    is_static: true
    normalization: "none"
    units: "fraction"
